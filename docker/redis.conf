# Redis configuration for Arellan Platform v2.0

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence (RDB snapshots)
save 900 1
save 300 10
save 60 10000

# Connection limits
maxclients 1000
timeout 300

# Security (set in production via REDIS_PASSWORD env)
# requirepass ${REDIS_PASSWORD}

# Slow log for debugging
slowlog-log-slower-than 10000
slowlog-max-len 128

# Event notification for keyspace (needed for BullMQ)
notify-keyspace-events Ex
